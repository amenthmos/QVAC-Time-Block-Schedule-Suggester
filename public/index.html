<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Time-Block Schedule Suggester</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #e8f2fb 0%, #d2e7fa 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #163256;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .icon { font-size: 2rem; margin-bottom: 4px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #1c5cb0; font-weight: 800; text-align: center; }
  .subtitle { color: #4d75a3; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fbfdff; border: 1px solid #c3ddf7; border-radius: 16px; padding: 28px 26px; box-shadow: 0 4px 16px rgba(28,92,176,0.08); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #163256; }
  textarea, input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #aed0f5;
    background: #fdfeff; color: #163256; font-family: inherit; font-size: 1rem; margin-bottom: 18px; resize: vertical;
  }
  textarea:focus, input[type=text]:focus { outline: none; border-color: #1c5cb0; }
  button.action {
    width: 100%; padding: 13px 20px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 700; font-family: inherit; cursor: pointer; background: #1c5cb0; color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  button.action:hover:not(:disabled) { background: #164b92; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #4d75a3; min-height: 1.2em; }
  #resultBox { margin-top: 18px; }
  .block-item { background: #eef6ff; border: 1px solid #c3ddf7; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: baseline; }
  .block-time { flex-shrink: 0; font-weight: 700; color: #1c5cb0; font-size: 0.9rem; min-width: 88px; }
  .block-task { color: #163256; }
  .footer-note { color: #4d75a3; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #c3ddf7;
    border-top-color: #1c5cb0; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🕒</div>
    <h1>Time-Block Schedule Suggester</h1>
    <p class="subtitle">Enter your tasks and hours available, get a time-blocked schedule. 100% on-device.</p>

    <div class="card">
      <label for="tasksInput">Your tasks for today (one per line)</label>
      <textarea id="tasksInput" rows="5" placeholder="e.g.&#10;Write project proposal&#10;Team standup&#10;Review pull requests&#10;Deep work on feature X"></textarea>
      <label for="hoursInput">Total hours available</label>
      <input type="text" id="hoursInput" placeholder="e.g. 6" />
      <button class="action" id="generateBtn">Build My Schedule</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const tasksInput = document.getElementById('tasksInput');
    const hoursInput = document.getElementById('hoursInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const tasks = tasksInput.value.trim();
      const hours = hoursInput.value.trim();
      if (!tasks) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Building your schedule...';

      try {
        const res = await fetch('/api/schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tasks, hours }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = data.schedule.map(b => `
          <div class="block-item">
            <div class="block-time">${escapeHtml(b.time)}</div>
            <div class="block-task">${escapeHtml(b.task)}</div>
          </div>
        `).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
